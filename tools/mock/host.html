<!doctype html><html lang="it"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#111}iframe{border:0;width:100%;height:100%}</style></head><body>
<home-assistant></home-assistant>
<script>
/* il finto Home Assistant vive nel pacchetto (frontend/esempio/casa.js), lo stesso della «casa di esempio» della plancia:
   qui lo apro con le scelte di prova «mock…» di localStorage e i messaggi in console */
let CASA = null;
window.hassConnection = new Promise(r => { window.casaPronta = r; });
</script>
<script type="module">
import { casaFinta } from "/custom_components/nduja_dashboard/frontend/esempio/casa.js";
CASA = casaFinta({ log: console.log });
window.casaPronta({ conn: CASA.conn, auth: CASA.auth });
</script>
<script>
if (localStorage.getItem("mockProvaAlexa")) addEventListener("DOMContentLoaded", () => {
  const b = document.createElement("button"); b.textContent = "🗣️ simula «Alexa»";
  b.style.cssText = "position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;padding:9px 16px;border-radius:999px;border:0;background:#13b4ee;color:#fff;font:600 14px system-ui;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer";
  b.onclick = () => window.mockAlexa(); document.body.appendChild(b); });
/* la plancia usa il fetch del suo iframe: intercetto le chiamate REST di Home Assistant */
addEventListener("DOMContentLoaded", () => { const fr = document.getElementById("fr"); const aggancia = () => { const w = fr.contentWindow, f0 = w.fetch.bind(w); w.fetch = (u, o) => CASA?.fetch(u, o) || f0(u, o); };
  fr.addEventListener("load", aggancia); try { if (fr.contentWindow?.fetch) aggancia(); } catch {} });
document.querySelector("home-assistant").hass = { themes: { darkMode: (location.hash!="#light") } };
</script>
<iframe id="fr" src="/custom_components/nduja_dashboard/frontend/index.html"></iframe></body></html>
