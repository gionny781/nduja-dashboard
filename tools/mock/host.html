        if (m.domain === "weather") return { response: { [m.target.entity_id]: { forecast: [0,1,2,3,4].map(i => ({ datetime: day(i, 12), condition: i ? "sunny" : "rainy", temperature: 20 + i, templow: 12, precipitation_probability: i ? 0 : 80 })) } } };
        console.log("SVC", JSON.stringify(m)); return { response: {} };
    }
    throw { code: "unknown", message: m.type };
  }
};
window.hassConnection = Promise.resolve({ conn });
document.querySelector("home-assistant").hass = { themes: { darkMode: (location.hash!="#light") } };
</script>
