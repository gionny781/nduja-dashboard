name: Release
# Pubblica da sola la release quando cambia la versione nel manifest:
# HACS mostra il numero di versione e avvisa gli utenti dell'aggiornamento.
on:
  push:
    branches: [main]
    paths:
      - custom_components/nduja_dashboard/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi la versione
        id: v
        run: echo "version=$(jq -r .version custom_components/nduja_dashboard/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Crea la release se non c'è
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V esiste già"; exit 0; fi
          NOTES=$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="'Nduja Dashboard $V"
          T="$V"; PRE=""
          case "$V" in
            *-dev*) T="${V%-dev} anteprima"; PRE="--prerelease --latest=false";;   # anteprima: HACS la mostra solo a chi attiva le versioni beta
            *beta*) T="${V%-beta} beta";;
          esac
          gh release create "v$V" --title "$T" --notes "$NOTES" --target "$GITHUB_SHA" $PRE
